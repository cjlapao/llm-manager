# ═══════════════════════════════════════════════════════════════
# Inkling 2 Mini — Thinking Machines (26.4B MoE, 3.4B active)
# Target: NVIDIA GB10 DGX Spark (128GB unified LPDDR5x)
#
# Based on the official vLLM recipe (dgx_spark_gb10 + reasoning,
# spec_decoding, tool_calling):
#   docker image : vllm/vllm-openai:inkling-2-mini
#   spec decode  : DSpark, 7 draft tokens, probabilistic draft sampling
#   parsers      : reasoning=inkling, tool-call=inkling
#
# Notes:
#  - Single ~20GB checkpoint, mixed NVFP4 + MXFP8. vLLM reads the
#    quant config from the checkpoint, so no --quantization flag.
#  - min_p and logit_bias are NOT supported with speculative decoding
#    (the server returns 400), so min_p is deliberately omitted below.
#  - Reasoning effort is per request via chat_template_kwargs:
#    none | minimal | low | medium | high | max, or a float 0.0-0.99.
#    Default is 0.9 (high). Even the minimum does not fully disable
#    reasoning, so keep max_tokens generous (1500+).
#  - DSpark acceptance drops at high temperature, so the fast variant
#    uses a lower temperature.
#  - Model supports up to 1M context; 262144 is the recipe default.
# ═══════════════════════════════════════════════════════════════
slug: inkling-2-mini
name: "Inkling 2 Mini"
engine: vllm
engine_version: inkling-2-mini   # docker tag: vllm/vllm-openai:inkling-2-mini
hf_repo: "thinkingmachines/Inkling-2-Mini"
container: inkling-2-mini
port: 8035
type: llm
subtype: chat
environment:
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  SAFETENSORS_FAST_GPU: "1"

input_token_cost: 0.000003
output_token_cost: 0.000015
cache_creation_input_token_cost: 0.00000375
cache_read_input_token_cost: 0.0000003
profile:
  total_params_b: 26.4
  active_params_b: 3.4          # 5.4B effective (middle 12 layers loop x3)
  is_moe: true                  # 8 of 128 experts per token
  attention_layers: 24          # hybrid locvllmal + global; split not published
  gdn_layers: 0
  num_kv_heads: 8               # TODO: not published, verify in config.json
  head_dim: 128                 # TODO: not published, verify in config.json
  supports_mtp: false           # uses DSpark draft, not MTP heads
  default_context: 262144
  max_context: 1000000
  quant_bytes_per_param: 0.75   # mixed NVFP4/MXFP8, ~20GB on disk
  max_num_seqs: 8
  max_num_batched_tokens: 4096
  gpu_memory_utilization: 0.8
  supports_thinking_effort: true
  speculative_decoding: dspark
  num_speculative_tokens: 7
  draft_sample_method: probabilistic
command:
  - serve
  - "--model ${{ .hf_repo }}"
  - "--served-model-name ${{ .slug }}"
  - "--tensor-parallel-size 1"
  - "--max-model-len ${{ .profile.default_context }}"
  - "--max-num-seqs ${{ .profile.max_num_seqs }}"
  - "--max-num-batched-tokens ${{ .profile.max_num_batched_tokens }}"
  - "--gpu-memory-utilization ${{ .profile.gpu_memory_utilization }}"
  - "--reasoning-parser inkling"
  - "--tool-call-parser inkling"
  - "--enable-auto-tool-choice"

capabilities:
  - reasoning
  - tool-use
  - multi-turn
  - image
litellm_params:
  custom_llm_provider: hosted_vllm
  temperature: 1.0
  top_p: 0.95
  presence_penalty: 0.0
  repetition_penalty: 1.0
  variants:
    thinking:
      suffix: -thinking
      temperature: 1.0
      top_p: 0.95
      presence_penalty: 0.0
      repetition_penalty: 1.0
    thinking-max:
      suffix: -thinking-max
      temperature: 1.0
      top_p: 0.95
      presence_penalty: 0.0
      repetition_penalty: 1.0
      extra_body:
        chat_template_kwargs:
          reasoning_effort: max
    coder:
      suffix: -coder-thinking
      temperature: 0.8
      top_p: 0.95
      presence_penalty: 0.0
      repetition_penalty: 1.0
      extra_body:
        chat_template_kwargs:
          reasoning_effort: max
    coder-thinking:
      suffix: -coder-thinking
      temperature: 0.8
      top_p: 0.95
      presence_penalty: 0.0
      repetition_penalty: 1.0
      extra_body:
        chat_template_kwargs:
          reasoning_effort: high
    coder-thinking-medium:
      suffix: -coder-thinking-medium
      temperature: 0.8
      top_p: 0.95
      presence_penalty: 0.0
      repetition_penalty: 1.0
      extra_body:
        chat_template_kwargs:
          reasoning_effort: medium
    coder-thinking-low:
      suffix: -coder-thinking-low
      temperature: 0.8
      top_p: 0.95
      presence_penalty: 0.0
      repetition_penalty: 1.0
      extra_body:
        chat_template_kwargs:
          reasoning_effort: low
    coder-fast:
      suffix: -coder-fast
      temperature: 0.6
      top_p: 0.95
      presence_penalty: 0.0
      repetition_penalty: 1.0
      extra_body:
        chat_template_kwargs:
          reasoning_effort: minimal
    instruct:
      suffix: -instruct
      temperature: 0.7
      top_p: 0.8
      presence_penalty: 0.0
      repetition_penalty: 1.0
      extra_body:
        chat_template_kwargs:
          reasoning_effort: none
