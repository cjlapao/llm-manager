# ═══════════════════════════════════════════════════════════════
# Laguna S 2.1 — NVFP4
# poolside/Laguna-S-2.1-NVFP4  ·  118B-A8B MoE (8B active) · 1M context
# Target: NVIDIA GB10 DGX Spark (128GB unified LPDDR5x, SM121 Blackwell)
# vLLM >= 0.19.0
#
# Footprint: weights ~66GB @ NVFP4 (~4.5 bits/param). This model wants
# almost the whole box — unlike your small 0.28-util models, it can't be
# co-located. gpu_memory_utilization 0.90 → ~115GB: ~66GB weights +
# ~49GB for KV/activations (enough for full 1M ctx at fp8 KV, ~26GB).
# ═══════════════════════════════════════════════════════════════

slug: laguna-s-2.1-nvfp4
name: "Laguna S 2.1 NVFP4"
engine: vllm
engine_version: v5
hf_repo: "poolside/Laguna-S-2.1-NVFP4"
container: laguna-s-2.1-nvfp4
port: 8029
type: llm
subtype: chat

input_token_cost: 0.000003
output_token_cost: 0.000015
cache_creation_input_token_cost: 0.00000375
cache_read_input_token_cost: 0.0000003

profile:
  total_params_b: 118
  active_params_b: 8
  is_moe: true
  attention_layers: 48
  gdn_layers: 0
  num_kv_heads: 8
  head_dim: 128
  supports_mtp: false
  default_context: 524288
  max_context: 524288
  quant_bytes_per_param: 0.5
  speculative_decoding: dflash
  speculative_model: poolside/Laguna-S-2.1-DFlash-NVFP4
  speculative_model_revision: 4cdcc6e9b29105e8ff5790885cadccbeb4f33f54
  num_speculative_tokens: 15
  max_num_seqs: 2
  max_num_batched_tokens: 4096

command:
  - ${{ .hf_repo }}
  - "--model ${{ .hf_repo }}"
  - "--served-model-name ${{ .slug }}"
  - "--revision 07614121b31898586430f189d27a25a0be310843"
  - "--kv-cache-dtype fp8"
  - "--dtype auto"
  - "--enable-chunked-prefill"
  - "--reasoning-parser poolside_v1"
  - "--tool-call-parser poolside_v1"
  - "--enable-auto-tool-choice"
#  - "--enable-prefix-caching"
  - "--trust-remote-code"
  - "--trust-request-chat-template"
  - "--generation-config auto"
  - "--disable-custom-all-reduce"
  - "--async-scheduling"
  - "--default-chat-template-kwargs '{\"enable_thinking\": true}'"
  - "--load-format instanttensor"

capabilities:
  - reasoning
  - tool-use
  - multi-turn

litellm_params:
  custom_llm_provider: hosted_vllm
  temperature: 0.7
  top_p: 0.95
  top_k: 20
  min_p: 0
  presence_penalty: 0.0
  repetition_penalty: 1.0
  extra_body:
    chat_template_kwargs:
      enable_thinking: true       # dropped preserve_thinking (not a Laguna template kwarg;
                                  # "preserved thinking" = keep reasoning_content in history, client-side)
  variants:
    thinking:
      suffix: -thinking
      temperature: 0.7
      top_p: 0.95
      top_k: 20
      min_p: 0
      presence_penalty: 0.0
      repetition_penalty: 1.0
      extra_body:
        chat_template_kwargs:
          enable_thinking: true
    coder-thinking:
      suffix: -coder-thinking
      temperature: 0.7
      top_p: 0.95
      top_k: 20
      min_p: 0
      presence_penalty: 1.5
      repetition_penalty: 1.0
      extra_body:
        chat_template_kwargs:
          enable_thinking: true
    coder-fast:
      suffix: -coder-fast
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      min_p: 0
      presence_penalty: 1.5
      repetition_penalty: 1.0
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
    instruct:
      suffix: -instruct
      temperature: 0.7
      top_p: 0.8
      top_k: 20
      min_p: 0
      presence_penalty: 1.5
      repetition_penalty: 1.0
      extra_body:
        chat_template_kwargs:
          enable_thinking: false